<form
  class="results-form"
  [formGroup]="seasonResultsForm"
  (ngSubmit)="sendSeasonResult()"
>
  <header class="form-header">
    <h1>Resultados oficiales</h1>

    <p>
      Selecciona los ganadores confirmados de cada categoría.
      Los resultados pendientes pueden quedarse vacíos.
    </p>
  </header>

  <section class="form-section">
    <h2>Competiciones</h2>

    <div class="form-fields">
      <div class="form-field">
        <label for="championsLeagueWinner">
          Ganador de la Champions
        </label>

        <p-select
          inputId="championsLeagueWinner"
          [filter]="true"
          filterBy="clubName"
          filterPlaceholder="Buscar equipo"
          [options]="championsLeagueTeams"
          formControlName="championsLeagueWinner"
          optionLabel="clubName"
          dataKey="id"
          placeholder="Selecciona un equipo"
          class="form-select"
          [showClear]="true"
        />
      </div>

      <div class="form-field">
        <label for="laLigaWinner">
          Ganador de LaLiga
        </label>

        <p-select
          inputId="laLigaWinner"
          [filter]="true"
          filterBy="clubName"
          filterPlaceholder="Buscar equipo"
          [options]="laLigaTeams"
          formControlName="laLigaWinner"
          optionLabel="clubName"
          dataKey="id"
          placeholder="Selecciona un equipo"
          class="form-select"
          [showClear]="true"
        />
      </div>

      <div class="form-field">
        <label for="copaReyWinner">
          Ganador de la Copa del Rey
        </label>

        <p-select
          inputId="copaReyWinner"
          [filter]="true"
          filterBy="clubName"
          filterPlaceholder="Buscar equipo"
          [options]="laLigaTeams"
          formControlName="copaReyWinner"
          optionLabel="clubName"
          dataKey="id"
          placeholder="Selecciona un equipo"
          class="form-select"
          [showClear]="true"
        />
      </div>

      <div class="form-field">
        <label for="superCopaWinner">
          Ganador de la Supercopa
        </label>

        <p-select
          inputId="superCopaWinner"
          [options]="superCopaTeams"
          formControlName="superCopaWinner"
          optionLabel="clubName"
          dataKey="id"
          placeholder="Selecciona un equipo"
          class="form-select"
          [showClear]="true"
        />
      </div>
    </div>
  </section>

  <section class="form-section">
    <h2>Premios de LaLiga</h2>

    <div class="form-fields">
      <div class="form-field">
        <label for="topScorer">
          Ganador del Pichichi
        </label>

        <p-select
          inputId="topScorer"
          [filter]="true"
          filterBy="name"
          filterPlaceholder="Buscar jugador"
          [options]="laLigaPlayers"
          formControlName="topScorer"
          optionLabel="name"
          dataKey="id"
          placeholder="Selecciona un jugador"
          class="form-select"
          [showClear]="true"
        />
      </div>

      <div class="form-field">
        <label for="standOutPlayer">
          Jugador revelación
        </label>

        <p-select
          inputId="standOutPlayer"
          [filter]="true"
          filterBy="name"
          filterPlaceholder="Buscar jugador"
          [options]="laLigaPlayers"
          formControlName="standOutPlayer"
          optionLabel="name"
          dataKey="id"
          placeholder="Selecciona un jugador"
          class="form-select"
          [showClear]="true"
        />
      </div>

      <div class="form-field">
        <label for="disappointmentPlayer">
          Jugador decepción
        </label>

        <p-select
          inputId="disappointmentPlayer"
          [filter]="true"
          filterBy="name"
          filterPlaceholder="Buscar jugador"
          [options]="laLigaPlayers"
          formControlName="disappointmentPlayer"
          optionLabel="name"
          dataKey="id"
          placeholder="Selecciona un jugador"
          class="form-select"
          [showClear]="true"
        />
      </div>

      <div class="form-field">
        <label for="zamoraWinner">
          Trofeo Zamora
        </label>

        <p-select
          inputId="zamoraWinner"
          [filter]="true"
          filterBy="name"
          filterPlaceholder="Buscar jugador"
          [options]="goalKeepers"
          formControlName="zamoraWinner"
          optionLabel="name"
          dataKey="id"
          placeholder="Selecciona un jugador"
          class="form-select"
          [showClear]="true"
        />
      </div>
    </div>
  </section>

  <section class="form-section">
    <h2>Premios internacionales</h2>

    <div class="form-fields">
      <div class="form-field">
        <label for="ballondOr">
          Balón de Oro
        </label>

        <p-select
          inputId="ballondOr"
          [filter]="true"
          filterBy="name"
          filterPlaceholder="Buscar jugador"
          [options]="ballonDorPlayers"
          formControlName="ballondOr"
          optionLabel="name"
          dataKey="id"
          placeholder="Selecciona un jugador"
          class="form-select"
          [showClear]="true"
        />
      </div>

      <div class="form-field">
        <label for="goldenBoot">
          Bota de Oro
        </label>

        <p-select
          inputId="goldenBoot"
          [filter]="true"
          filterBy="name"
          filterPlaceholder="Buscar jugador"
          [options]="ballonDorPlayers"
          formControlName="goldenBoot"
          optionLabel="name"
          dataKey="id"
          placeholder="Selecciona un jugador"
          class="form-select"
          [showClear]="true"
        />
      </div>
    </div>
  </section>

  <footer class="form-actions">
    <button
      pButton
      type="submit"
      icon="pi pi-save"
    >
      Guardar resultados
    </button>
  </footer>
</form>
